<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HuVa Academy — Cohort 01 Joiner Card</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Noto+Sans+Armenian:wght@400;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --y: #E9EF00;
  --b: #1200FF;
  --k: #0A0A0A;
  --p: #FAFAF7;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #F4F4EE;
  min-height: 100vh;
  font-family: 'DM Mono', monospace;
  color: var(--k);
  overflow-x: hidden;
}

/* ── App ── */
.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 16px 12px 28px;
  max-width: 440px;
  margin: 0 auto;
  min-height: 100vh;
}

/* ── Format toggle (Square / Story) ── */
.format-toggle {
  display: inline-flex;
  gap: 0;
  padding: 3px;
  background: #fff;
  border: 1.5px solid var(--k);
  border-radius: 100px;
  box-shadow: 0 2px 0 var(--k);
}
.format-btn {
  padding: 6px 14px;
  background: transparent;
  border: 0;
  border-radius: 100px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: #777;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}
.format-btn.active {
  background: var(--k);
  color: var(--y);
}
.format-btn:not(.active):hover { color: var(--k); }

/* ── Preview ── */
.preview {
  position: relative;
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1;
}
.preview.story {
  max-width: 220px;
  aspect-ratio: 9 / 16;
}

/* ════════════════════════════════════════════════════
   THE CARD — themeable + dual format (square / story)
   ════════════════════════════════════════════════════ */
.card {
  /* Default theme: YELLOW */
  --bg: var(--y);
  --fg: var(--k);
  --border: var(--k);
  --accent: var(--b);
  --shadow: var(--b);
  --pill-fg: var(--y);
  --mark-bg: var(--k);
  --mark-fg: var(--y);
  --dot: rgba(0, 0, 0, 0.06);
  --stripe: rgba(10, 10, 10, 0.85);
  --stamp-bg: rgba(255, 255, 255, 0.4);

  width: 1080px;
  height: 1080px;
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;

  background: var(--bg);
  border: 14px solid var(--border);
  padding: 64px 68px;

  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 24px;

  overflow: hidden;
}

.card[data-format="story"] {
  height: 1920px;
  padding: 90px 68px;
  gap: 32px;
}

/* THEMES */
.card[data-theme="blue"] {
  --bg: var(--b);
  --fg: #FFFFFF;
  --border: var(--k);
  --accent: var(--y);
  --shadow: var(--y);
  --pill-fg: var(--b);
  --mark-bg: #FFFFFF;
  --mark-fg: var(--b);
  --dot: rgba(255, 255, 255, 0.07);
  --stripe: rgba(255, 255, 255, 0.18);
  --stamp-bg: rgba(0, 0, 0, 0.22);
}
.card[data-theme="black"] {
  --bg: var(--k);
  --fg: var(--p);
  --border: var(--y);
  --accent: var(--y);
  --shadow: var(--y);
  --pill-fg: var(--k);
  --mark-bg: var(--y);
  --mark-fg: var(--k);
  --dot: rgba(255, 255, 255, 0.06);
  --stripe: rgba(233, 239, 0, 0.18);
  --stamp-bg: rgba(0, 0, 0, 0.35);
}
.card[data-theme="cream"] {
  --bg: var(--p);
  --fg: var(--k);
  --border: var(--k);
  --accent: var(--b);
  --shadow: var(--b);
  --pill-fg: var(--p);
  --mark-bg: var(--b);
  --mark-fg: var(--p);
  --dot: rgba(0, 0, 0, 0.05);
  --stripe: rgba(18, 0, 255, 0.4);
  --stamp-bg: rgba(255, 255, 255, 0.5);
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at center, var(--dot) 1.2px, transparent 1.2px);
  background-size: 11px 11px;
  pointer-events: none;
  z-index: 0;
}
.card::after {
  content: '';
  position: absolute;
  bottom: 0;
  right: 0;
  width: 360px;
  height: 360px;
  background: repeating-linear-gradient(-45deg, var(--stripe) 0 7px, transparent 7px 24px);
  clip-path: polygon(100% 0%, 100% 100%, 0% 100%);
  opacity: 0.22;
  pointer-events: none;
  z-index: 0;
}
.card[data-format="story"]::after {
  width: 460px;
  height: 460px;
}

/* TOP */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 2;
}

.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--mark-bg);
  color: var(--mark-fg);
  display: grid;
  place-items: center;
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 900;
  font-size: 38px;
  line-height: 1;
  letter-spacing: -0.02em;
}
.brand-text {
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 900;
  font-size: 36px;
  letter-spacing: -0.005em;
  color: var(--fg);
  line-height: 1;
}
.cohort {
  font-family: 'DM Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.22em;
  color: var(--fg);
  border: 2.5px solid var(--border);
  padding: 9px 14px;
  background: transparent;
  transform: rotate(2deg);
  white-space: nowrap;
}
.card[data-format="story"] .brand-mark { width: 68px; height: 68px; font-size: 46px; }
.card[data-format="story"] .brand-text { font-size: 44px; }
.card[data-format="story"] .cohort { font-size: 16px; padding: 11px 16px; }

/* HERO */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 18px;
  position: relative;
  z-index: 2;
}
.card[data-format="story"] .hero { gap: 28px; }

.avatar-frame {
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: var(--p);
  border: 14px solid var(--border);
  position: relative;
  overflow: hidden;
  box-shadow: 16px 16px 0 var(--shadow);
}
.card[data-format="story"] .avatar-frame {
  width: 440px;
  height: 440px;
  border-width: 16px;
  box-shadow: 20px 20px 0 var(--shadow);
}

.avatar-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

.avatar-placeholder {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 900;
  font-size: 200px;
  color: var(--k);
  background: var(--p);
  line-height: 1;
}
.card[data-format="story"] .avatar-placeholder { font-size: 250px; }

.name-tag {
  background: var(--fg);
  color: var(--bg);
  padding: 11px 22px;
  border-radius: 100px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: 0.06em;
  margin-top: 10px;
  border: 3px solid var(--fg);
  transform: rotate(-2deg);
  white-space: nowrap;
}
.card[data-format="story"] .name-tag { font-size: 26px; padding: 12px 26px; }

.title {
  font-family: 'Noto Sans Armenian', sans-serif;
  font-weight: 900;
  font-size: 116px;
  line-height: 0.85;
  letter-spacing: -0.045em;
  color: var(--fg);
  margin-top: 4px;
}
.title span { display: block; }
.title .blue { color: var(--accent); }
.title.lang-en {
  font-family: 'Big Shoulders Display', 'Noto Sans Armenian', sans-serif;
  font-size: 152px;
  letter-spacing: -0.015em;
  line-height: 0.88;
}
.card[data-format="story"] .title { font-size: 140px; }
.card[data-format="story"] .title.lang-en { font-size: 178px; }

.sub {
  font-family: 'DM Mono', monospace;
  font-size: 18px;
  letter-spacing: 0.18em;
  color: var(--fg);
  text-transform: uppercase;
  font-weight: 500;
  margin-top: 6px;
}
.card[data-format="story"] .sub { font-size: 22px; margin-top: 12px; }

/* BOTTOM */
.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  position: relative;
  z-index: 2;
}
.bottom-left { display: flex; flex-direction: column; gap: 6px; }
.tag {
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: 0.05em;
  color: var(--fg);
  text-transform: uppercase;
  line-height: 1;
}
.tag .pill {
  background: var(--accent);
  color: var(--pill-fg);
  padding: 2px 10px;
  display: inline-block;
}
.url {
  font-family: 'DM Mono', monospace;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--fg);
}
.qr {
  width: 100px;
  height: 100px;
  background: var(--p);
  padding: 6px;
  border: 3px solid var(--border);
  border-radius: 8px;
  flex-shrink: 0;
}
.qr img, .qr canvas { width: 100% !important; height: 100% !important; display: block; }
.card[data-format="story"] .tag { font-size: 26px; }
.card[data-format="story"] .url { font-size: 18px; }
.card[data-format="story"] .qr { width: 130px; height: 130px; }

/* STAMP */
.stamp {
  position: absolute;
  top: 220px;
  left: 60px;
  transform: rotate(-14deg);
  z-index: 5;
  border: 5px double var(--accent);
  color: var(--accent);
  padding: 9px 22px;
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 900;
  font-size: 30px;
  letter-spacing: 0.18em;
  background: var(--stamp-bg);
  pointer-events: none;
  text-transform: uppercase;
  box-shadow: inset 0 0 0 2px var(--accent);
}
.card[data-format="story"] .stamp {
  top: 380px;
  left: 80px;
  font-size: 38px;
  padding: 11px 28px;
}

/* ════════════════════════════════════════════════════
   CONTROLS — naked layout, no card. Elements sit on page.
   ════════════════════════════════════════════════════ */
.controls {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  text-align: center;
  padding: 0;
  background: transparent;
}

.field { display: flex; flex-direction: column; gap: 7px; align-items: stretch; }
.field label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #666;
  text-align: center;
}

.field input[type="text"] {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--k);
  border-radius: 10px;
  font-family: 'Noto Sans Armenian', 'DM Mono', monospace;
  font-size: 13px;
  background: #fff;
  color: var(--k);
  outline: none;
  text-align: center;
  transition: all 0.15s ease;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.06);
}
.field input[type="text"]:focus {
  border-color: var(--b);
  box-shadow: 0 0 0 3px rgba(18, 0, 255, 0.12), 0 2px 0 rgba(0, 0, 0, 0.06);
}

/* Color swatches */
.color-row { display: flex; justify-content: center; gap: 12px; padding: 2px 0 14px; }
.color {
  width: 30px;
  height: 30px;
  border: 2px solid var(--k);
  border-radius: 50%;
  background: var(--swatch);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  position: relative;
  padding: 0;
}
.color:hover { transform: scale(1.12); box-shadow: 0 2px 0 var(--k); }
.color.active {
  box-shadow: 0 0 0 2px #F4F4EE, 0 0 0 4px var(--k), 0 3px 0 4px var(--k);
  transform: scale(1.08);
}
.color::after {
  content: attr(data-label);
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #888;
  white-space: nowrap;
}

/* Preset pills */
.preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.preset {
  padding: 9px 5px;
  background: #fff;
  border: 1.5px solid var(--k);
  border-radius: 10px;
  color: var(--k);
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.85);
}
.preset:hover {
  transform: translateY(-1px);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.85);
}
.preset.active {
  background: var(--y);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.85);
}
.preset b {
  font-family: 'Big Shoulders Display', 'Noto Sans Armenian', sans-serif;
  font-weight: 900;
  font-size: 10px;
  letter-spacing: -0.005em;
}

/* Avatar upload */
.upload {
  position: relative;
  width: 100%;
  min-height: 48px;
  border: 1.5px dashed var(--k);
  border-radius: 10px;
  background: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 10px;
  transition: all 0.15s ease;
}
.upload:hover { border-color: var(--b); border-style: solid; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.85); }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.04em; color: #666; text-align: center; }
.upload-label b { color: var(--b); }

/* Action row (Download + Copy) — bigger, nicer */
.action-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 4px;
  flex-wrap: wrap;
}
.btn {
  border: 0;
  padding: 12px 22px;
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 900;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 100px;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--k);
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  min-width: 140px;
}
.btn-primary { background: var(--b); color: #fff; }
.btn-primary:hover { background: #0C00CC; transform: translateY(-2px); box-shadow: 0 6px 0 var(--k); }
.btn-secondary {
  background: #fff;
  color: var(--k);
  border: 1.5px solid var(--k);
  padding: 10.5px 22px;
}
.btn-secondary:hover { background: var(--y); transform: translateY(-2px); box-shadow: 0 6px 0 var(--k); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--k); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Share pills */
.share-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 2px; }
.share-btn {
  padding: 6px 12px;
  background: #fff;
  border: 1.5px solid var(--k);
  border-radius: 100px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-decoration: none;
  color: var(--k);
  transition: all 0.15s ease;
  cursor: pointer;
}
.share-btn:hover { background: var(--y); transform: translateY(-1px); box-shadow: 0 2px 0 var(--k); }

.footer {
  margin-top: 8px;
  padding-top: 12px;
  border-top: 1px dashed #bbb;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: #888;
  letter-spacing: 0.04em;
  line-height: 1.6;
  text-align: center;
}
.footer a { color: var(--b); text-decoration: none; font-weight: 500; }
.footer a:hover { text-decoration: underline; }

/* ── Mobile ── */
@media (max-width: 420px) {
  .app { padding: 12px 12px 24px; gap: 14px; }
  .preview { max-width: 320px; }
  .preview.story { max-width: 190px; }
  .controls { gap: 12px; max-width: 340px; }
  .field input[type="text"] { padding: 9px 12px; font-size: 13px; }
  .upload { min-height: 44px; padding: 8px; }
  .upload-label { font-size: 9px; }
  .preset { padding: 8px 4px; min-height: 34px; }
  .preset b { font-size: 9px; }
  .preset-row { gap: 4px; }
  .color { width: 28px; height: 28px; }
  .color::after { display: none; }
  .color-row { gap: 10px; padding: 0 0 6px; }
  .action-row { gap: 6px; }
  .btn { padding: 11px 18px; font-size: 11px; min-width: 130px; }
  .btn-secondary { padding: 9.5px 18px; }
  .share-btn { font-size: 9px; padding: 5px 10px; }
  .field label { font-size: 8px; letter-spacing: 0.14em; }
}

@media (max-width: 340px) {
  .action-row { flex-direction: column; align-items: stretch; }
  .btn { width: 100%; min-width: 0; max-width: 240px; align-self: center; }
}
</style>
</head>
<body>

<main class="app">

  <!-- Format toggle -->
  <div class="format-toggle">
    <button class="format-btn active" data-format="square">▣ Square 1:1</button>
    <button class="format-btn" data-format="story">▤ Story 9:16</button>
  </div>

  <!-- Card preview -->
  <div class="preview" id="preview">
    <div class="card" id="card">

      <header class="top">
        <div class="brand">
          <div class="brand-mark">H</div>
          <div class="brand-text">HUVA / ACADEMY</div>
        </div>
        <div class="cohort" id="cohortBadge">★ ԱՌԱՋԻՆ ԿՈՀՈՐՏ</div>
      </header>

      <section class="hero">
        <div class="avatar-frame" id="avatarFrame">
          <div class="avatar-placeholder" id="avatarPh">N</div>
          <img id="avatarImg" style="display:none" alt="" />
        </div>

        <div class="name-tag" id="nameTag">@nicko</div>

        <h1 class="title">
          <span id="titleLine1">ՈՐՈՇԵԼ ԵՄ.</span>
          <span class="blue" id="titleLine2">ԿԱՌՈՒՑՈՒՄ ԵՄ</span>
        </h1>

        <p class="sub" id="subText">★ ՆՈՐ ԵՍ · 14 ՕՐ · 20·05·2026 ★</p>
      </section>

      <footer class="bottom">
        <div class="bottom-left">
          <div class="tag" id="tagText">★ ՀԱՅ <span class="pill">AI</span> ՍԵՐՈՒՆԴ</div>
          <div class="url" id="urlText">huva.io/academy</div>
        </div>
        <div class="qr" id="qr"></div>
      </footer>

      <div class="stamp">JOINED</div>

    </div>
  </div>

  <!-- Controls -->
  <section class="controls">

    <div class="field">
      <label>Background</label>
      <div class="color-row">
        <button class="color active" data-theme="yellow" data-label="Yellow" style="--swatch: #E9EF00" title="HUVA Yellow #E9EF00"></button>
        <button class="color" data-theme="blue" data-label="Blue" style="--swatch: #1200FF" title="HUVA Blue #1200FF"></button>
        <button class="color" data-theme="black" data-label="Black" style="--swatch: #0A0A0A" title="HUVA Black #0A0A0A"></button>
        <button class="color" data-theme="cream" data-label="Cream" style="--swatch: #FAFAF7" title="HUVA Cream #FAFAF7"></button>
      </div>
    </div>

    <div class="field">
      <label>🇦🇲 Armenian</label>
      <div class="preset-row">
        <button class="preset active" data-preset="builder_hy"><b>★ ՈՐՈՇԵԼ</b></button>
        <button class="preset" data-preset="rebel_hy"><b>⚡ ՉԵՄ ՍՊԱՍԵԼ</b></button>
        <button class="preset" data-preset="first_hy"><b>🥇 ԱՌԱՋԻՆ</b></button>
      </div>
    </div>

    <div class="field">
      <label>🇬🇧 English</label>
      <div class="preset-row">
        <button class="preset" data-preset="builder_en"><b>★ DECIDED.</b></button>
        <button class="preset" data-preset="dayone_en"><b>⚡ DAY ONE.</b></button>
        <button class="preset" data-preset="classof_en"><b>🥇 CLASS OF '26</b></button>
      </div>
    </div>

    <div class="field">
      <label>Name / Handle</label>
      <input type="text" id="nameInput" value="@nicko" maxlength="32" />
    </div>

    <div class="field">
      <label>Avatar</label>
      <div class="upload">
        <input type="file" id="avatarInput" accept="image/*" />
        <div class="upload-label"><b>Click</b> to upload your photo</div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" id="downloadBtn">⬇ Download</button>
      <button class="btn btn-secondary" id="copyBtn">📋 Copy</button>
    </div>

    <div class="share-btns">
      <a class="share-btn" id="shareIG" href="#">📸 IG Story</a>
      <a class="share-btn" id="shareTW" href="#" target="_blank" rel="noopener">𝕏 Twitter</a>
      <a class="share-btn" id="shareLI" href="#" target="_blank" rel="noopener">in LinkedIn</a>
    </div>

    <div class="footer">
      huva.io · launches 20 May 2026 · join the <a href="https://huva.io/academy">course</a>
    </div>

  </section>

</main>

<script>
// ═══ Config ═══
const COURSE_URL = 'https://huva.io/academy';

// ═══ Scale 1080-wide card to fit preview ═══
function scaleCard() {
  const wrap = document.getElementById('preview');
  const card = document.getElementById('card');
  if (!wrap || !card) return;
  const w = wrap.offsetWidth;
  const scale = w / 1080;
  card.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', scaleCard);
window.addEventListener('load', scaleCard);
requestAnimationFrame(scaleCard);

// ═══ QR code → course page ═══
new QRCode(document.getElementById('qr'), {
  text: COURSE_URL,
  width: 88,
  height: 88,
  colorDark: '#0A0A0A',
  colorLight: '#FAFAF7',
  correctLevel: QRCode.CorrectLevel.M
});

// ═══ Live name update ═══
const nameInput = document.getElementById('nameInput');
const nameTag = document.getElementById('nameTag');
const avatarPh = document.getElementById('avatarPh');

nameInput.addEventListener('input', () => {
  const v = (nameInput.value || '').trim() || '@huva';
  nameTag.textContent = v;
  avatarPh.textContent = (v.replace(/^@/, '').charAt(0).toUpperCase() || 'H');
});

// ═══ Avatar upload ═══
const avatarInput = document.getElementById('avatarInput');
const avatarImg = document.getElementById('avatarImg');

avatarInput.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    avatarImg.src = ev.target.result;
    avatarImg.style.display = 'block';
    avatarPh.style.display = 'none';
  };
  reader.readAsDataURL(f);
});

// ═══ Format toggle (square / story) ═══
document.querySelectorAll('.format-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    e.preventDefault();
    const fmt = btn.dataset.format;
    const card = document.getElementById('card');
    const preview = document.getElementById('preview');

    if (fmt === 'square') {
      card.removeAttribute('data-format');
      preview.classList.remove('story');
    } else {
      card.dataset.format = 'story';
      preview.classList.add('story');
    }

    document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    scaleCard();
  });
});

// ═══ Color theme ═══
document.querySelectorAll('.color').forEach(btn => {
  btn.addEventListener('click', e => {
    e.preventDefault();
    const theme = btn.dataset.theme;
    const card = document.getElementById('card');
    if (theme === 'yellow') card.removeAttribute('data-theme');
    else card.dataset.theme = theme;
    document.querySelectorAll('.color').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ═══ Preset switcher ═══
const presets = {
  builder_hy: { lang: 'hy', title1: 'ՈՐՈՇԵԼ ԵՄ.', title2: 'ԿԱՌՈՒՑՈՒՄ ԵՄ', cohort: '★ ԱՌԱՋԻՆ ԿՈՀՈՐՏ', sub: '★ ՆՈՐ ԵՍ · 14 ՕՐ · 20·05·2026 ★', tag: '★ ՀԱՅ <span class="pill">AI</span> ՍԵՐՈՒՆԴ' },
  rebel_hy:   { lang: 'hy', title1: 'ՉԵՄ ՍՊԱՍԵԼ.', title2: 'ԿԱՌՈՒՑՈՒՄ ԵՄ', cohort: '★ ԱՌԱՋԻՆ ԿՈՀՈՐՏ', sub: '★ 20·05·2026 · ՆՈՐ ԷՋ ★', tag: '★ ՉԵՄ <span class="pill">ՍՊԱՍՈՒՄ</span> ԵՐԲԵՎԷ' },
  first_hy:   { lang: 'hy', title1: 'ԵՍ ԱՌԱՋԻՆ', title2: 'ԿՈՀՈՐՏ 01', cohort: '★ N° 01 / 26', sub: '★ HUVA ACADEMY · 20·05·2026 ★', tag: '★ ՀԱՅ <span class="pill">AI</span> ՍԵՐՈՒՆԴ' },
  builder_en: { lang: 'en', title1: 'DECIDED.', title2: 'BUILDING.', cohort: '★ FIRST COHORT', sub: '★ NEW SELF · 14 DAYS · 20·05·2026 ★', tag: '★ BUILT WITH <span class="pill">AI</span>' },
  dayone_en:  { lang: 'en', title1: 'DAY ONE.', title2: 'FOREVER.', cohort: '★ COHORT 01 / 26', sub: '★ HUVA ACADEMY · 20·05·2026 ★', tag: '★ EARLY BY <span class="pill">DESIGN</span>' },
  classof_en: { lang: 'en', title1: 'CLASS OF', title2: 'TWENTY-SIX.', cohort: '★ N° 01 / 26', sub: '★ HUVA ACADEMY · COHORT 01 ★', tag: '★ ARMENIAN <span class="pill">AI</span> GEN' }
};

document.querySelectorAll('.preset').forEach(btn => {
  btn.addEventListener('click', e => {
    e.preventDefault();
    const p = presets[btn.dataset.preset];
    if (!p) return;
    document.getElementById('titleLine1').textContent = p.title1;
    document.getElementById('titleLine2').textContent = p.title2;
    document.getElementById('cohortBadge').textContent = p.cohort;
    document.getElementById('subText').textContent = p.sub;
    document.getElementById('tagText').innerHTML = p.tag;

    const titleEl = document.querySelector('.title');
    titleEl.classList.remove('lang-hy', 'lang-en');
    titleEl.classList.add('lang-' + p.lang);

    document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ═══ Capture card → canvas ═══
async function captureCard() {
  const card = document.getElementById('card');
  const oldTransform = card.style.transform;
  card.style.transform = 'none';
  await new Promise(r => requestAnimationFrame(r));

  const isStory = card.dataset.format === 'story';
  const canvas = await html2canvas(card, {
    width: 1080,
    height: isStory ? 1920 : 1080,
    scale: 2,
    backgroundColor: null,
    useCORS: true,
    logging: false
  });

  card.style.transform = oldTransform;
  return { canvas, isStory };
}

function buildFilename(isStory) {
  const card = document.getElementById('card');
  const handle = (nameInput.value || 'card').replace(/[^a-zA-Z0-9_-]/g, '').toLowerCase();
  const theme = card.dataset.theme || 'yellow';
  const fmt = isStory ? 'story' : 'square';
  return `huva-cohort-01-${fmt}-${theme}-${handle || 'card'}.png`;
}

// ═══ Download ═══
const downloadBtn = document.getElementById('downloadBtn');
downloadBtn.addEventListener('click', async () => {
  downloadBtn.disabled = true;
  const oldText = downloadBtn.textContent;
  downloadBtn.textContent = '⏳ Rendering…';

  try {
    const { canvas, isStory } = await captureCard();
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = buildFilename(isStory);
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  } catch (err) {
    alert('Download failed: ' + err.message);
  }

  downloadBtn.disabled = false;
  downloadBtn.textContent = oldText;
});

// ═══ Copy to clipboard ═══
const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async () => {
  copyBtn.disabled = true;
  const oldText = copyBtn.textContent;
  copyBtn.textContent = '⏳ Copying…';

  try {
    if (!navigator.clipboard || !window.ClipboardItem) {
      throw new Error('Clipboard API not supported in this browser. Use Download instead.');
    }
    const { canvas } = await captureCard();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);

    copyBtn.textContent = '✓ Copied!';
    setTimeout(() => { copyBtn.textContent = oldText; copyBtn.disabled = false; }, 1800);
    return;
  } catch (err) {
    alert('Copy failed: ' + err.message);
    copyBtn.textContent = oldText;
  }
  copyBtn.disabled = false;
});

// ═══ Quick share ═══
const tweetText = "Ես միանում եմ HuVa Academy-ի առաջին կոհորտին. 14 օր հետո կդառնամ AI-ով աշխատող իմ նոր տարբերակը 🚀";

document.getElementById('shareTW').href =
  `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}&url=${encodeURIComponent(COURSE_URL)}`;
document.getElementById('shareLI').href =
  `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(COURSE_URL)}`;
document.getElementById('shareIG').addEventListener('click', e => {
  e.preventDefault();
  alert('Save the PNG and post it to your IG Story. Tag @huva.academy 🚀');
});
</script>

</body>
</html>
